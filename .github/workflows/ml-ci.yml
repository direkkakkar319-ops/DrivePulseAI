name: ml

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ml/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check ml/

      - name: Run Pytest Model Smoke Tests
        run: |
          PYTHONPATH=ml pytest ml/tests

  serving-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ml/hf_deployment/requirements.txt"
      - name: Install pinned inference runtime and test tools
        run: |
          python -m pip install -r ml/hf_deployment/requirements.txt pytest 'httpx>=0.28,<1'
      - name: Test authenticated KIT serving against the real artifact
        run: |
          PYTHONPATH=. python -m pytest ml/hf_deployment/tests -q
