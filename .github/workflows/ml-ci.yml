name: ml

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ml/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check ml/

      - name: Run Pytest Model Smoke Tests
        run: |
          if [ -d ml/tests ] && find ml/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            PYTHONPATH=ml pytest ml/tests
          else
            echo "::notice title=ML tests pending::No ML test files are present yet; add the Nissan Leaf model tests when they are ready."
          fi
