name: render-health

on:
  deployment_status:

permissions:
  contents: read

jobs:
  backend-health:
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment_url, 'drivepulse-backend')
    runs-on: ubuntu-latest
    steps:
      - name: Check backend and database health
        env:
          SERVICE_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          case "$SERVICE_URL" in
            https://*.onrender.com) ;;
            *)
              echo "Unexpected backend deployment URL: $SERVICE_URL"
              exit 1
              ;;
          esac

          check_endpoint() {
            local url="$1"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 10 "$url"; then
                echo "✅ Healthy: $url"
                return 0
              fi
              echo "Waiting for $url ($attempt/18)..."
              sleep 10
            done
            echo "❌ Health check timed out: $url"
            return 1
          }

          check_endpoint "${SERVICE_URL%/}/health"
          check_endpoint "${SERVICE_URL%/}/health/db"

  ml-health:
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment_url, 'drivepulseai')
    runs-on: ubuntu-latest
    steps:
      - name: Check ML service health
        env:
          SERVICE_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          case "$SERVICE_URL" in
            https://*.onrender.com) ;;
            *)
              echo "Unexpected ML deployment URL: $SERVICE_URL"
              exit 1
              ;;
          esac

          HEALTH_URL="${SERVICE_URL%/}/health"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL"; then
              echo "✅ ML service is healthy."
              exit 0
            fi
            echo "Waiting for ML health endpoint ($attempt/18)..."
            sleep 10
          done

          echo "❌ ML service did not become healthy within 3 minutes."
          exit 1
