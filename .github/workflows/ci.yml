name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint-ml:
    name: ML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
      - name: Ruff
        run: ruff check ml/

  lint-backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff -r backend/requirements.txt
      - name: Ruff
        run: ruff check backend/

  lint-frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint --if-present

  lint-mobile:
    name: Mobile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: ESLint
        working-directory: mobile
        run: npm run lint --if-present
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit

  test-ml:
    name: ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt pytest
      - name: Run Nissan Leaf model tests when present
        run: |
          if [ -d ml/tests ] && find ml/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            PYTHONPATH=ml pytest ml/tests
          else
            echo "::notice title=ML tests pending::No ML test files are present yet; this job will run them when added."
          fi

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drivepulse
          POSTGRES_PASSWORD: drivepulse_test
          POSTGRES_DB: drivepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivepulse -d drivepulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://drivepulse:drivepulse_test@127.0.0.1:5432/drivepulse_test
      TEST_DATABASE_URL: postgresql+psycopg2://drivepulse:drivepulse_test@127.0.0.1:5432/drivepulse_test
      FIREBASE_PROJECT_ID: drivepulse-d2034
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio -r backend/requirements.txt
      - name: Pytest
        run: pytest backend/tests

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests when configured
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::notice title=Frontend tests pending::No frontend test script is configured yet."
          fi
      - name: Build frontend
        working-directory: frontend
        run: npm run build
