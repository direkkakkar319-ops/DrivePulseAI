name: render-deploy-bot

on:
  push:
    branches:
      - chore/remove-nissan-leaf-workflow
      - main
    paths:
      - "backend/**"
      - "ml/hf_deployment/**"
      - ".github/workflows/render-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Service(s) to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - ml

jobs:
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'backend'
    steps:
      - name: Trigger Render Backend Deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "❌ Error: RENDER_BACKEND_DEPLOY_HOOK secret is not configured in GitHub."
            echo "👉 Go to: Repository Settings > Secrets and variables > Actions"
            echo "👉 Add new secret: RENDER_BACKEND_DEPLOY_HOOK with the URL from Render -> drivepulse-backend -> Settings -> Deploy Hook"
            exit 1
          fi
          echo "🚀 Triggering Render backend deployment..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response body: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Render backend deployment successfully triggered (HTTP $http_code)."
          else
            echo "❌ Render API returned HTTP $http_code"
            exit 1
          fi

  deploy-ml:
    name: Deploy ML Service
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'ml'
    steps:
      - name: Trigger Render ML Deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_ML_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "⚠️ Notice: RENDER_ML_DEPLOY_HOOK secret is not configured. Skipping ML deploy."
            echo "👉 To enable auto-deploy for ML: Add secret RENDER_ML_DEPLOY_HOOK from Render -> Drive-pulse-ai-ml -> Settings -> Deploy Hook"
            exit 0
          fi
          echo "🚀 Triggering Render ML service deployment..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response body: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Render ML deployment successfully triggered (HTTP $http_code)."
          else
            echo "❌ Render API returned HTTP $http_code"
            exit 1
          fi
