name: backend

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drivepulse
          POSTGRES_PASSWORD: drivepulse_test
          POSTGRES_DB: drivepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivepulse -d drivepulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://drivepulse:drivepulse_test@127.0.0.1:5432/drivepulse_test
      TEST_DATABASE_URL: postgresql+psycopg2://drivepulse:drivepulse_test@127.0.0.1:5432/drivepulse_test
      FIREBASE_PROJECT_ID: drivepulse-d2034

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Ruff Linting
        run: |
          ruff check backend/

      - name: Run Pytest
        run: |
          pytest backend/tests
