name: publish-hf-inference-image

on:
  push:
    branches: [chore/remove-nissan-leaf-workflow]
    paths:
      - "ml/hf_deployment/**"
      - ".github/workflows/publish-hf-inference-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/drivepulseai-inference

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Linux inference image
        uses: docker/build-push-action@v6
        with:
          context: ml/hf_deployment
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v1
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
