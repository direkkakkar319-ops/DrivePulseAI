# Local PostgreSQL with persistent storage; backend can also target a cloud URL.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drivepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drivepulse_dev}
      POSTGRES_DB: drivepulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - drivepulse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivepulse -d drivepulse"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  drivepulse_postgres:
