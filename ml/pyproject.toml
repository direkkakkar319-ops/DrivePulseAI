[project]
name = "drivepulse-ml"
version = "0.1.0"
description = "ML training, inference, and explainability for DrivePulse AI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint.per-file-ignores]
# Scripts that bootstrap sys.path before third-party imports.
"notebooks/*.py" = ["E402"]
"src/training/*.py" = ["E402"]
"src/models/failure_classifier.py" = ["E402"]
